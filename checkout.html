<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pemesanan - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h2>Form Pemesanan Buku</h2>
        <nav>
            <a href="dashboard.html">Home</a>
            <a href="stock.html">Katalog Stok</a>
            <a href="checkout.html">Pemesanan</a>
            <a href="tracking.html">Tracking</a>
        </nav>
    </header>
    <div class="container">
        <h2>Formulir Checkout Pesanan</h2>
        <form id="formCheckout">
            <div class="form-group">
                <label>Nama Pemesan</label>
                <input type="text" id="namaPemesan" required>
            </div>
            <div class="form-group">
                <label>Pilih Buku</label>
                <select id="pilihBuku" required>
                    <!-- Opsi akan dimuat via JS dari data.js -->
                </select>
            </div>
            <div class="form-group">
                <label>Jumlah Pesanan</label>
                <input type="number" id="jumlahPesan" min="1" step="1" value="1" required>
            </div>
            <div class="form-group">
                <label>Metode Pembayaran</label>
                <select id="metodeBayar">
                    <option value="Transfer Bank">Transfer Bank</option>
                    <option value="E-Wallet">E-Wallet (OVO/GoPay/Dana)</option>
                    <option value="COD">COD (Bayar di Tempat)</option>
                </select>
            </div>
            <button type="submit">Proses Pesanan</button>
        </form>

        <div style="margin-top: 30px;">
            <h3>Riwayat Pesanan Sementara</h3>
            <table id="tabelPesanan">
                <thead>
                    <tr>
                        <th>Nama Pemesan</th>
                        <th>Buku</th>
                        <th>Jumlah</th>
                        <th>Total Harga</th>
                        <th>Pembayaran</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Hasil input pemesanan masuk ke sini -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="../js/data.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
