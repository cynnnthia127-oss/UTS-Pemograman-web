<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 100px;">
        <h2>Login Toko Buku</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="admin@buku.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="******">
            </div>
            <button type="submit" style="width: 100%;">Login</button>
        </form>
        <div style="margin-top: 15px; text-align: center;">
            <a href="#" id="btnLupa">Lupa Password?</a> | 
            <a href="#" id="btnDaftar">Daftar Akun</a>
        </div>
    </div>

    <!-- Modal Box untuk Lupa Password / Daftar -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <p id="modalText">Pesan Informasi</p>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
